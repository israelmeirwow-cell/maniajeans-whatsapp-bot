# Evolution API v2 — the WhatsApp gateway (Baileys now, official Cloud API later).
#
#   cd deploy/evolution
#   cp .env.example .env        # set a strong AUTHENTICATION_API_KEY
#   docker compose up -d
#   → API on http://localhost:8080  (manager UI: http://localhost:8080/manager)
#
# Then, from the project root:  python3 -m app.whatsapp.setup
# (creates the instance, shows the pairing QR, registers our webhook)
#
# ⚠️ Baileys mode is unofficial — use a DEDICATED number, never the business's main line.

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY:?set it in deploy/evolution/.env}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false      # privacy: don't retain message bodies
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - LANGUAGE=en
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"       # so the container can reach the bot on the host

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_pg:
  evolution_redis:
