<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאניה ג'ינס — דשבורד שירות</title>
<style>
  :root { --brand:#075e54; --brand2:#128c7e; --bg:#f4f6f8; --card:#fff; --ink:#1c2733; --mut:#7b8794;
          --good:#22a06b; --warn:#e8a13a; --bad:#d64545; --line:#e6eaee; }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI",Heebo,Arial,sans-serif; }
  body { background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:19px; font-weight:600; }
  header .sub { font-size:12.5px; opacity:.8; margin-top:2px; }
  header .right { display:flex; align-items:center; gap:14px; font-size:13px; }
  header a { color:#c8f0e6; text-decoration:none; border:1px solid rgba(255,255,255,.35); padding:6px 14px; border-radius:8px; }
  main { max-width:1180px; margin:24px auto; padding:0 20px; display:flex; flex-direction:column; gap:20px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .kpi .v { font-size:26px; font-weight:700; }
  .kpi .l { font-size:12.5px; color:var(--mut); margin-top:3px; }
  .kpi.hl .v { color:var(--brand2); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:900px){ .grid2{grid-template-columns:1fr} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .card h2 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .badge { font-size:11px; padding:2px 10px; border-radius:10px; background:#eef2f5; color:var(--mut); font-weight:400; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:13px; }
  .bar-row .name { width:110px; color:var(--ink); }
  .bar-wrap { flex:1; background:#eef2f5; border-radius:6px; height:18px; overflow:hidden; }
  .bar { height:100%; background:linear-gradient(90deg,var(--brand2),var(--brand)); border-radius:6px; min-width:2px; }
  .bar-row .n { width:34px; text-align:left; color:var(--mut); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:right; color:var(--mut); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--line); }
  td { padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pill { display:inline-block; padding:2px 10px; border-radius:10px; font-size:11.5px; }
  .pill.open { background:#fdf3d7; color:#8a6202; }
  .pill.resolved { background:#e2f5ec; color:#1d7a52; }
  .pill.handoff { background:#fde5e5; color:#a33; }
  .btn { background:var(--brand2); color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:12.5px; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  .resolve-box { margin-top:8px; display:flex; gap:8px; }
  .resolve-box textarea { flex:1; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px; resize:vertical; min-height:44px; font-family:inherit; }
  .lesson { border-right:3px solid var(--brand2); background:#f8fbfa; border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:13px; }
  .lesson .t { color:var(--mut); font-size:12px; margin-bottom:3px; }
  .feed-item { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .feed-item .ts { color:var(--mut); font-size:11.5px; white-space:nowrap; }
  .feed-item .intent { color:var(--brand2); font-size:11.5px; white-space:nowrap; }
  .empty { color:var(--mut); font-size:13px; padding:12px 0; text-align:center; }
  .ok-toast { position:fixed; bottom:24px; right:24px; background:var(--good); color:#fff; padding:12px 22px; border-radius:10px; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.25); display:none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>דשבורד שירות — מאניה ג'ינס</h1>
    <div class="sub">בוט וואטסאפ · מתעדכן אוטומטית כל 10 שניות</div>
  </div>
  <div class="right">
    <span id="updated"></span>
    <a href="/report" target="_blank">📊 דוח שבועי ↗</a>
    <a href="/" target="_blank">פתח צ'אט ↗</a>
  </div>
</header>
<main>
  <div id="sim-status" style="display:none; background:#e8f4ef; border:1px solid #bfe3d3; border-radius:12px; padding:10px 18px; font-size:13.5px; color:#1d5c43;"></div>
  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="card">
      <h2>פילוח פניות לפי נושא</h2>
      <div id="intents"></div>
    </div>
    <div class="card">
      <h2>העברות לנציג <span class="badge" id="handoff-badge"></span></h2>
      <div id="handoffs"></div>
    </div>
  </div>

  <div class="card">
    <h2>🎫 פניות לבירור (פערי ידע) <span class="badge">מענה כאן מלמד את הבוט אוטומטית</span></h2>
    <div id="tickets"></div>
  </div>

  <div class="card">
    <h2>⚡ פעולות שהבוט ביצע <span class="badge">יומן ביקורת — כל ניסיון נרשם</span></h2>
    <div id="actions"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>📚 לקחים שהבוט למד</h2>
      <div id="lessons"></div>
    </div>
    <div class="card">
      <h2>שיחות אחרונות</h2>
      <div id="feed"></div>
    </div>
  </div>
</main>
<div class="ok-toast" id="toast"></div>

<script>
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load() {
  const d = await (await fetch("/api/dashboard")).json();
  const k = d.kpis;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi hl"><div class="v">${k.conversations}</div><div class="l">שיחות</div></div>
    <div class="kpi"><div class="v">${k.messages}</div><div class="l">הודעות</div></div>
    <div class="kpi"><div class="v">${k.handoff_rate}%</div><div class="l">שיעור העברה לנציג</div></div>
    <div class="kpi"><div class="v">${k.open_tickets}</div><div class="l">בירורים פתוחים</div></div>
    <div class="kpi"><div class="v">${k.lessons}</div><div class="l">לקחים שנלמדו</div></div>
    <div class="kpi"><div class="v">${k.actions_executed ?? 0}</div><div class="l">פעולות שבוצעו</div></div>
    <div class="kpi"><div class="v">$${(k.api_cost_usd ?? 0).toFixed(3)}</div><div class="l">עלות API מוערכת</div></div>
    <div class="kpi"><div class="v">${k.catalog.products.toLocaleString()}</div><div class="l">מוצרים בקטלוג</div></div>`;

  const maxI = Math.max(1, ...d.intents.map(r => r.count));
  document.getElementById("intents").innerHTML = d.intents.map(r => `
    <div class="bar-row"><div class="name">${esc(r.label)}</div>
      <div class="bar-wrap"><div class="bar" style="width:${100 * r.count / maxI}%"></div></div>
      <div class="n">${r.count}</div></div>`).join("") || '<div class="empty">אין נתונים עדיין</div>';

  document.getElementById("handoff-badge").textContent = d.handoffs.length + " אחרונות";
  document.getElementById("handoffs").innerHTML = d.handoffs.map(h => `
    <div class="feed-item"><span class="ts">${esc(h.ts)}</span>
      <span class="pill handoff">${esc(h.intent)}</span><span>${esc(h.reason)}</span></div>`).join("")
    || '<div class="empty">אין העברות</div>';

  document.getElementById("tickets").innerHTML = d.tickets.length ? `
    <table><tr><th>מס'</th><th>נושא</th><th>שאלה</th><th>לקוח</th><th>סטטוס</th><th></th></tr>
    ${d.tickets.map(t => `
      <tr>
        <td>${esc(t.id)}</td><td>${esc(t.topic)}</td><td>${esc(t.question)}</td>
        <td>${esc(t.customer_name || "")} ${esc(t.phone || "")}</td>
        <td><span class="pill ${t.status}">${t.status === "open" ? "פתוח" : "נענה"}</span></td>
        <td>${t.status === "open"
          ? `<button class="btn" onclick="toggleResolve('${t.id}')">ענה ולמד</button>`
          : esc((t.answer || "").slice(0, 60))}</td>
      </tr>
      <tr id="res-${t.id}" style="display:none"><td colspan="6">
        <div class="resolve-box">
          <textarea id="ans-${t.id}" placeholder="התשובה המדויקת ללקוח — תישלח ללמידה והבוט ידע אותה מעכשיו"></textarea>
          <button class="btn" onclick="resolveTicket('${t.id}')">שלח ולמד ✓</button>
        </div></td></tr>`).join("")}
    </table>` : '<div class="empty">אין בירורים פתוחים — הבוט מסתדר לבד</div>';

  const RESULT_HE = { executed:"בוצע", staged:"ממתין לאישור", refused_identity:"נדחה — אימות",
    refused_eligibility:"נדחה — לא זכאי", refused_rate_limit:"נדחה — מגבלה", refused_not_found:"נדחה — לא נמצא" };
  document.getElementById("actions").innerHTML = (d.actions || []).length ? `
    <table><tr><th>זמן</th><th>פעולה</th><th>הזמנה</th><th>תוצאה</th><th>לפני → אחרי</th></tr>
    ${d.actions.map(a => `
      <tr><td>${esc((a.ts || "").slice(5, 16))}</td><td>${esc(a.action)}</td><td>${esc(a.target)}</td>
        <td><span class="pill ${a.result === "executed" ? "resolved" : (a.result === "staged" ? "open" : "handoff")}">${RESULT_HE[a.result] || esc(a.result)}</span></td>
        <td>${a.before ? esc(a.before) + " ← " + esc(a.after || "—") : ""}</td></tr>`).join("")}
    </table>` : '<div class="empty">טרם בוצעו פעולות</div>';

  document.getElementById("lessons").innerHTML = d.lessons.map(l => `
    <div class="lesson"><div class="t">${esc(l.ts)} · ${esc(l.source)}</div>
      <b>כשלקוח ${esc(l.trigger)}</b><br>← ${esc(l.guidance)}</div>`).join("")
    || '<div class="empty">עדיין לא נלמדו לקחים</div>';

  const MOOD = { angry: '😠 כועס', annoyed: '😕 מתוסכל' };
  document.getElementById("feed").innerHTML = d.recent.map(c => `
    <div class="feed-item"><span class="ts">${esc((c.ts || "").slice(5, 16))}</span>
      <span class="intent">${esc(c.intent)}</span>
      <span>${esc(c.message)}${c.handoff ? ' <span class="pill handoff">נציג</span>' : ""}${
        MOOD[c.sentiment] ? ` <span class="pill handoff">${MOOD[c.sentiment]}</span>` : ""}</span></div>`).join("")
    || '<div class="empty">אין שיחות עדיין</div>';

  const simEl = document.getElementById("sim-status");
  if (d.sim && d.sim.updated_at) {
    simEl.style.display = "";
    simEl.innerHTML = d.sim.running
      ? `🤖 סימולטור רץ · $${d.sim.cost_usd} מתוך $${d.sim.budget} · ${d.sim.messages} הודעות · ${d.sim.conversations} שיחות · ${d.sim.handoffs} העברות`
      : `סימולטור אחרון: $${d.sim.cost_usd} · ${d.sim.messages} הודעות · הסתיים ${d.sim.updated_at}`;
  }

  document.getElementById("updated").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL");
}

function toggleResolve(id) {
  const r = document.getElementById("res-" + id);
  r.style.display = r.style.display === "none" ? "" : "none";
}

async function resolveTicket(id) {
  const answer = document.getElementById("ans-" + id).value.trim();
  if (!answer) return;
  const res = await fetch(`/tickets/${id}/resolve`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ answer }),
  });
  const out = await res.json();
  const toast = document.getElementById("toast");
  toast.textContent = out.resolved ? "✓ הבירור נענה והבוט למד את התשובה" : "שגיאה: " + (out.error || "");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 3500);
  load();
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
